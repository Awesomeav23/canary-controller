name: Canary rollout
description: >
  Start a canary rollout on canary-controller and wait for it. The step fails if the
  rollout is rolled back or aborted, or if its result can't be determined.

inputs:
  api-url:
    description: Controller base URL
    required: true
  app:
    description: App name (Deployments {app}-stable / {app}-canary)
    required: true
  image:
    description: Image to roll out
    required: true
  token:
    description: API token (CANARY_API_TOKEN on the controller). Pass from a secret.
    required: false
    default: ""
  policy-file:
    description: Path to a rollout policy YAML. Default is the controller's.
    required: false
    default: ""
  timeout-seconds:
    description: How long to wait for a result
    required: false
    default: "1800"
  abort-on-timeout:
    description: Abort the rollout if it hasn't finished in time
    required: false
    default: "false"

outputs:
  rollout-id:
    description: Rollout id on the controller
    value: ${{ steps.rollout.outputs.rollout_id }}
  state:
    description: succeeded | rolled_back | aborted (or still active on timeout)
    value: ${{ steps.rollout.outputs.state }}
  reason:
    description: Why it ended that way
    value: ${{ steps.rollout.outputs.reason }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install canary-rollout
      shell: bash
      run: pip install --quiet "$GITHUB_ACTION_PATH/../../.."

    # Inputs go through env, never ${{ }} inside the script: no shell injection from an
    # image tag or app name.
    - name: Roll out
      id: rollout
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
        APP: ${{ inputs.app }}
        IMAGE: ${{ inputs.image }}
        CANARY_API_TOKEN: ${{ inputs.token }}
        POLICY_FILE: ${{ inputs.policy-file }}
        TIMEOUT: ${{ inputs.timeout-seconds }}
        ABORT_ON_TIMEOUT: ${{ inputs.abort-on-timeout }}
      run: |
        args=(--api "$API_URL" --app "$APP" --image "$IMAGE" --timeout "$TIMEOUT")
        if [ -n "$POLICY_FILE" ]; then args+=(--policy "$POLICY_FILE"); fi
        if [ "$ABORT_ON_TIMEOUT" = "true" ]; then args+=(--abort-on-timeout); fi
        canary-rollout "${args[@]}"
