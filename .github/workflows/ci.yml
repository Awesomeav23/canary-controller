name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # Runs the real composite action against a real controller started in this job.
  # There's no Prometheus here, so the controller sees no metrics and must fail closed:
  # the action should report rolled_back and fail its step.
  action-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: canary
          MYSQL_USER: canary
          MYSQL_PASSWORD: canary
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=3s --health-retries=30
    env:
      CANARY_DATABASE_URL: mysql+pymysql://canary:canary@127.0.0.1:3306/canary
      CANARY_API_TOKEN: ci-test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: alembic upgrade head
      - name: Start controller
        run: |
          CANARY_ROUTER=log CANARY_TICK_SECONDS=1 \
            nohup uvicorn --factory canary.api:create_app --port 8020 > controller.log 2>&1 &
          for _ in $(seq 30); do curl -sf localhost:8020/healthz && exit 0; sleep 1; done
          cat controller.log; exit 1
      - name: Writes need the token
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8020/rollouts \
            -H 'content-type: application/json' -d '{"app":"x","image":"x:1"}')
          test "$code" = 401
      - name: Fast policy
        run: |
          cat > fast.yaml <<'EOF'
          min_requests: 0
          steps: [{ weight: 50, pause_seconds: 1 }, { weight: 100, pause_seconds: 1 }]
          thresholds: [{ metric: error_rate, max: 0.05 }]
          EOF
      - uses: ./.github/actions/canary-rollout
        id: canary
        continue-on-error: true
        with:
          api-url: http://localhost:8020
          token: ci-test-token
          app: demo
          image: demo-app:e2e
          policy-file: fast.yaml
          timeout-seconds: "60"
      - name: Action reported the rollback
        env:
          OUTCOME: ${{ steps.canary.outcome }}
          STATE: ${{ steps.canary.outputs.state }}
          REASON: ${{ steps.canary.outputs.reason }}
          ROLLOUT_ID: ${{ steps.canary.outputs.rollout-id }}
        run: |
          echo "outcome=$OUTCOME state=$STATE id=$ROLLOUT_ID reason=$REASON"
          test "$OUTCOME" = failure
          test "$STATE" = rolled_back
          test -n "$ROLLOUT_ID"
          case "$REASON" in *"no data"*) ;; *) exit 1 ;; esac
      - if: failure()
        run: cat controller.log

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: canary_test
          MYSQL_USER: canary
          MYSQL_PASSWORD: canary
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=3s --health-retries=30
    env:
      CANARY_TEST_DATABASE_URL: ${{ matrix.db == 'mysql' && 'mysql+pymysql://canary:canary@127.0.0.1:3306/canary_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e '.[dev]'
      - run: pytest -q

  # The whole thing on a fresh kind cluster: demo app, Prometheus, and the controller
  # running as a pod with its own MySQL. Pod-ratio mode: a bad release must roll back on
  # real error metrics (not "no data") and a good one must be promoted. Then Envoy Gateway:
  # a bad release must be caught at the first (5%) step.
  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: make cluster
      - run: make images
      - run: make deploy
      - run: make incluster-deploy
      - name: Forward the controller
        run: |
          nohup make incluster-forward > forward.log 2>&1 &
          for _ in $(seq 30); do curl -sf localhost:8020/healthz && exit 0; sleep 1; done
          cat forward.log; exit 1
      - name: Bad release is rolled back on its error rate
        run: |
          CANARY_API_TOKEN=$(make -s incluster-token)
          export CANARY_API_TOKEN
          set +e
          canary-rollout --api http://localhost:8020 --app demo --image demo-app:v2-bad --timeout 600
          code=$?
          set -e
          test "$code" = 1
          curl -s 'localhost:8020/rollouts?limit=1' | grep -q 'error_rate='
      - name: Good release is promoted
        run: |
          CANARY_API_TOKEN=$(make -s incluster-token)
          export CANARY_API_TOKEN
          canary-rollout --api http://localhost:8020 --app demo --image demo-app:v2 --timeout 900
          kubectl get deploy demo-stable -o jsonpath='{.spec.template.spec.containers[0].image}' \
            | grep -qx demo-app:v2
      # Mode C: weighted routing through Envoy Gateway, controller switched to it.
      - run: make gateway-install
      - run: make gateway-deploy
      - run: make incluster-deploy ROUTER=gateway
      - name: Bad release is caught at 5% of traffic
        run: |
          CANARY_API_TOKEN=$(make -s incluster-token)
          export CANARY_API_TOKEN
          set +e
          canary-rollout --api http://localhost:8020 --app demo --image demo-app:v2-bad \
            --policy policies/gateway.yaml --timeout 600
          code=$?
          set -e
          test "$code" = 1
          curl -s 'localhost:8020/rollouts?limit=1' | grep -q 'error_rate='
          curl -s 'localhost:8020/rollouts?limit=1' | python3 -c \
            "import sys,json; assert json.load(sys.stdin)[0]['step_index'] == 0"
          kubectl get httproute demo -o jsonpath='{.spec.rules[0].backendRefs[1].weight}' \
            | grep -qx 0
      - if: failure()
        run: |
          kubectl get pods -A
          kubectl logs deploy/canary-controller --all-containers --tail=200
          cat forward.log

  demo-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t demo-app:ci demo-app
      - run: docker build -t canary-controller:ci .
