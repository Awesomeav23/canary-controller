# Default rollout policy, used when POST /rollouts has no "policy".
total_replicas: 4                 # stable + canary replicas combined
analysis_window_seconds: 60       # PromQL window each check looks back over
min_requests: 50                  # canary needs this many requests in the window to be judged
max_wait_for_traffic_seconds: 120 # wait this long past a step's pause for traffic, then roll back

steps:                            # weight = % of replicas on the canary
  - { weight: 25, pause_seconds: 60 }
  - { weight: 50, pause_seconds: 60 }
  - { weight: 100, pause_seconds: 60 }

# Each check can have a hard ceiling (max), a limit relative to the current stable
# version (max_over_stable, in the metric's own units), or both.
thresholds:
  - { metric: error_rate, max: 0.05, max_over_stable: 0.01 }      # ≤5%, and ≤1 point worse than stable
  - { metric: p95_latency_ms, max: 500, max_over_stable: 100 }    # ≤500 ms, and ≤100 ms slower than stable
