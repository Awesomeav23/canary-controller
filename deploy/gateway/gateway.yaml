# Weighted routing for the GatewayRouter (CANARY_ROUTER=gateway).
# Needs Envoy Gateway installed first: `make gateway-install`.
#
#   loadgen -> demo-gateway (Envoy) -> HTTPRoute "demo" -> demo-stable (weight 100-x)
#                                                       -> demo-canary (weight x)
#
# The controller only ever patches the HTTPRoute's backendRefs weights.

# Envoy's Service gets a fixed name and stays inside the cluster (kind has no load
# balancer), so the load generator can use a stable DNS name.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: demo-proxy
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
        name: demo-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gw
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: demo-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
spec:
  parentRefs: [{ name: demo-gw }]
  rules:
    - backendRefs:
        - { kind: Service, name: demo-stable, port: 80, weight: 100 }
        - { kind: Service, name: demo-canary, port: 80, weight: 0 }
---
# One Service per track (the replica-mode Service "demo" selects both).
apiVersion: v1
kind: Service
metadata:
  name: demo-stable
spec:
  selector: { app: demo, track: stable }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: demo-canary
spec:
  selector: { app: demo, track: canary }
  ports: [{ port: 80, targetPort: 8080 }]
