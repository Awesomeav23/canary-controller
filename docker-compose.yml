services:
  mysql:
    image: mysql:8.4
    container_name: canary-mysql
    environment:
      MYSQL_DATABASE: canary
      MYSQL_USER: canary
      MYSQL_PASSWORD: canary
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - canary-mysql:/var/lib/mysql
      - ./deploy/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      retries: 30

volumes:
  canary-mysql:
